name: GNN Benchmark CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric scikit-learn pandas numpy matplotlib seaborn pyyaml ruff black pytest pytest-cov

      - name: Run Ruff Lint Check
        run: |
          python -m ruff check .

      - name: Run Black Code Format Check
        run: |
          python -m black --check .

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Run Synthetic Benchmark Smoke Test
        run: |
          python scripts/run_benchmark.py --synthetic --seeds 42 123 --epochs 10

      - name: Build Docker Image
        run: |
          docker build -t gnn-citation-classification:latest .
